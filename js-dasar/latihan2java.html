<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas Latihan Pengulangan JavaScript</title>
</head>

<body>
  <script>
    // no 1
    var input = prompt("Apakah sudah membayar? (Ya/Tidak)");
    if (input == "ya")
    {
      console.log("Kamu boleh ikut ujian");
    } else
    {
      console.log("kamu belum bisa ikut ujian");
    }

    // no 2
    var inputSuhu = prompt("Berapa suhu hari ini?");
    if (parseInt(inputSuhu) <= 20)
    {
      console.log("udara dingain");
    } else
    {
      console.log("Tidak ada keterangan");
    }

    // no 3
    var inputNilai = prompt("Masukkan nilai");
    if (inputNilai >= 85)
    {
      console.log("A");
    } else if (inputNilai >= 70 && inputNilai <= 84)
    {
      console.log("B");
    } else if (inputNilai >= 50 && inputNilai <= 69)
    {
      console.log("C");
    } else
    {
      console.log("D");
    }

    //memakai 'true' karena rentang nilai (no 3)
    switch (true)
    {
      case inputNilai >= 85: console.log("A"); break;
      case inputNilai >= 70: console.log("B"); break;
      case inputNilai >= 50: console.log("C"); break;
      default: console.log("D"); break;
    }

    //no 4
    var usia = parseInt(prompt("Masukkan Usia Anda"));
    var tiket = 100000;

    if (usia < 10)
    {
      tiket = tiket - (tiket * 50 / 100);
      console.log(tiket);

    } else if (usia >= 10 && usia <= 17)
    {
      tiket = tiket - (tiket * 25 / 100);
      console.log(tiket);
    } else
    {
      console.log(tiket);
    }

    //no 5
    var roda = parseInt(prompt("rODANYA "));
    switch (roda)
    {
      case 2:
        console.log("MOTORRR"); break;

      case 4:
        console.log("MOBILLL"); break;

      case 6:
        console.log("TREGGG"); break;

      default: console.LOG("mobil mobilan");
        break;
    }




    //no 6
    for (let index = 1; index <= 10; index++)
    {
      console.log(`${index}  X 5 = ${index * 5}`);
    }

    //no 6 versi lain
    for (i = 1; i <= 10; i++)
    {
      hasil = i * 5;
      console.log(i + ' x 5 = ' + hasil);
    }





  </script>
</body>

</html>
